<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}RevisAI{% endblock %}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1f3d2b;
    --ink-2:#16291d;
    --chalk:#f4f1e6;
    --chalk-dim:#cfd8c9;
    --amber:#e8a33d;
    --amber-dim:#b97f28;
    --rule:#3a5a44;
  }
  body{
    background:var(--chalk);
    font-family:'Inter',sans-serif;
    color:#20291f;
  }
  .font-display{font-family:'Zilla Slab',serif;}
  .font-mono-lbl{font-family:'IBM Plex Mono',monospace;}
  .chalkboard{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.05), transparent 60%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    border-bottom:6px solid var(--amber);
  }
  .chalk-underline{
    position:relative;
    display:inline-block;
  }
  .chalk-underline svg{
    position:absolute;
    left:0; right:0; bottom:-10px;
    width:100%;
    height:10px;
  }
  .card-note{
    background:#fffdf7;
    border:1px solid #e3ddc9;
    box-shadow:0 1px 0 #e3ddc9, 0 8px 20px -12px rgba(31,61,43,0.35);
    border-left:4px solid var(--rule);
  }
  .btn-amber{
    background:var(--amber);
    color:#1f1608;
    font-weight:600;
    transition:transform .12s ease, background .15s ease;
  }
  .btn-amber:hover{ background:var(--amber-dim); transform:translateY(-1px); }
  .btn-ghost{
    border:1px solid var(--ink);
    color:var(--ink);
    font-weight:600;
  }
  .btn-ghost:hover{ background:var(--ink); color:var(--chalk); }
  .tag-eyebrow{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:.7rem;
    color:var(--amber-dim);
  }
  ::selection{ background:var(--amber); color:#1f1608; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<header class="chalkboard text-chalk">
  <div class="max-w-4xl mx-auto px-6 py-6 flex items-center justify-between">
    <a href="{{ url_for('index') }}" class="flex items-center gap-3">
      <span class="w-9 h-9 rounded-sm bg-amber-400 flex items-center justify-center font-display font-bold text-lg" style="background:var(--amber); color:#1f1608;">R</span>
      <span class="font-display text-xl md:text-2xl tracking-tight" style="color:var(--chalk);">RevisAI</span>
    </a>
    <span class="tag-eyebrow hidden sm:block">Weak-topic diagnostic quiz</span>
  </div>
</header>

<main class="flex-1">
  {% block content %}{% endblock %}
</main>

<footer class="max-w-4xl mx-auto px-6 py-8 text-xs text-center font-mono-lbl" style="color:#5c6b5f;">
  RevisAI — notes in, weak spots out.
</footer>

</body>
</html>
